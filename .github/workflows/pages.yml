name: Update and deploy dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "10 1 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "30 12 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Restore trusted state and history
        uses: actions/cache/restore@v6
        with:
          path: data
          key: qdii-monitor-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            qdii-monitor-data-${{ runner.os }}-

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Fetch current limits and build site
        env:
          QDII_WEBHOOK_URL: ${{ secrets.QDII_WEBHOOK_URL }}
          QDII_SMTP_HOST: ${{ secrets.QDII_SMTP_HOST }}
          QDII_SMTP_PORT: ${{ secrets.QDII_SMTP_PORT }}
          QDII_SMTP_USER: ${{ secrets.QDII_SMTP_USER }}
          QDII_SMTP_PASSWORD: ${{ secrets.QDII_SMTP_PASSWORD }}
          QDII_EMAIL_FROM: ${{ secrets.QDII_EMAIL_FROM }}
        run: |
          npm start
          npm run build:site

      - name: Save trusted state and history
        uses: actions/cache/save@v6
        with:
          path: data
          key: qdii-monitor-data-${{ runner.os }}-${{ github.run_id }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
